/* V3: edge-aligned productive desktop workspace. No centered max-width container. */
:root{--bg:#f8f9fa;--border:#dee3e8;--blue:#214f99}
.topbar{padding:0 30px;gap:40px}
.content{width:auto;max-width:none;margin:31px 30px 72px}
.page-heading{margin-bottom:19px}
.page-heading h1{font-size:25px;letter-spacing:-.55px}
.search-panel{padding:17px 20px;margin-bottom:26px;border-radius:7px}
.filters{grid-template-columns:minmax(180px,1.18fr) minmax(125px,.8fr) minmax(125px,.8fr) minmax(90px,.54fr) minmax(180px,1.7fr) 120px;gap:16px}
.filter-action{width:120px}
.results-heading{margin-bottom:12px;align-items:center}
.results{border-radius:7px}
.room-head,.room-row{display:grid;grid-template-columns:minmax(200px,2.3fr) minmax(95px,.8fr) minmax(230px,2.65fr) minmax(120px,1.05fr) minmax(194px,1.5fr);column-gap:18px;align-items:center}
.room-head{padding:12px 20px;background:#f2f4f6;border-bottom:1px solid var(--border);font-size:11px;text-transform:none;letter-spacing:.01em;font-weight:650;color:#697480}
.room-row{padding:16px 20px;min-height:72px;gap:18px;border-bottom:1px solid #e9edf0}
.room-row:hover{background:#f9fbfd}
.room-main{flex:none}
.room-title{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.room-title strong{font-size:14px}
.room-description{margin:0;color:#576370;font-size:13px;line-height:1.4}
.room-capacity{font-size:13px;font-weight:540;color:#384453}
.room-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#466a55}
.room-status .status-dot{width:6px;height:6px;border-radius:100%;background:#40815b;display:inline-block;flex:none}
.room-status.unavailable{color:#8a6660}
.room-status.unavailable .status-dot{background:#aa7567}
.room-actions{justify-content:flex-end;gap:8px}
.room-actions .btn.text{color:#496178}
.table td,.table th{padding-left:22px;padding-right:22px}
.week-days{gap:8px}
.day{min-height:215px}
@media(max-width:1120px){
  .filters{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filters .equipment{grid-column:span 3}
  .filters .filter-action{grid-column:span 1;width:100%}
  .room-head,.room-row{grid-template-columns:minmax(160px,1.9fr) minmax(74px,.8fr) minmax(180px,2.4fr) minmax(95px,.9fr) minmax(170px,1.4fr);gap:10px}
  .room-head,.room-row{padding-left:13px;padding-right:13px}
  .room-actions{gap:2px}
  .room-actions .btn{padding-left:9px;padding-right:9px}
}
@media(max-width:820px){
  .content{margin:25px 18px 62px}
  .room-head{display:none}
  .room-row{grid-template-columns:minmax(140px,1.5fr) minmax(75px,.7fr) minmax(170px,1.8fr) auto;gap:12px;padding:16px}
  .room-status{display:none}
  .room-actions{grid-column:4;gap:5px}
  .room-actions .btn.text{display:none}
  .topbar{padding:0 18px}
}
@media(max-width:640px){
  .content{margin:23px 16px 52px;width:auto}
  .page-heading h1{font-size:24px}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
  .filters .equipment,.filters .filter-action{grid-column:span 2}
  .room-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:17px 15px}
  .room-main{grid-column:1}
  .room-capacity{grid-column:2;text-align:right}
  .room-description{grid-column:1/-1;font-size:12px}
  .room-actions{grid-column:1/-1;justify-content:flex-start;margin-top:3px}
  .room-actions .btn.text{display:inline-flex}
  .search-panel{padding:15px}
  .results-heading{align-items:flex-start}
  .room-head{display:none}
  .topbar{padding:0 14px;gap:12px}
  .tabs{gap:8px}
  .tab{font-size:11px}
  .account-toggle .avatar{width:27px;height:27px}
}
</style>

<body><div id="root" class="shell"></div>
<script>
/* Self-contained CROBS visual prototype. Sample data only; Java model is not modified. */
const rooms0=[{id:'r1',type:'lectureTheatre',capacity:120,features:['projector','wifi','audio']},{id:'r2',type:'seminarRoom',capacity:24,features:['whiteboard','wifi','display']},{id:'r3',type:'computerLab',capacity:32,features:['computers','wifi','projector']},{id:'r4',type:'meetingRoom',capacity:8,features:['wifi','display']},{id:'r5',type:'seminarRoom',capacity:40,features:['whiteboard','projector']}];
const users0=[{id:'u1',name:'SuperAdmin',role:'SUPERADMIN'},{id:'u2',name:'Alex Chen',role:'REGULAR'},{id:'u3',name:'Jamie Lee',role:'ADMIN'}];
const bookings0=[{id:'b1',roomId:'r1',userId:'u2',date:'2026-11-03',start:'09:00',end:'10:30',purpose:'Lecture planning'},{id:'b2',roomId:'r1',userId:'u3',date:'2026-11-03',start:'15:00',end:'17:00',purpose:'Team session'},{id:'b3',roomId:'r2',userId:'u2',date:'2026-11-03',start:'10:00',end:'11:30',purpose:'Seminar preparation'},{id:'b4',roomId:'r2',userId:'u3',date:'2026-11-03',start:'16:00',end:'17:00',purpose:'Group meeting'},{id:'b5',roomId:'r3',userId:'u2',date:'2026-11-03',start:'12:00',end:'14:00',purpose:'Programming lab'},{id:'b6',roomId:'r4',userId:'u3',date:'2026-11-03',start:'14:00',end:'16:00',purpose:'Research discussion'},{id:'b7',roomId:'r2',userId:'u2',date:'2026-11-04',start:'09:00',end:'10:00',purpose:'Revision'},{id:'b8',roomId:'r3',userId:'u1',date:'2026-11-05',start:'11:00',end:'12:30',purpose:'Demonstration'}];
const copy=x=>JSON.parse(JSON.stringify(x));
const s={rooms:copy(rooms0),users:copy(users0),bookings:copy(bookings0),nextB:9,currentId:'u1',page:'find',adminPage:'rooms',search:{date:'2026-11-03',start:'14:00',end:'15:00',capacity:10,features:['wifi']},draft:null,chosenRoom:'r2',weekStart:'2026-11-02',panel:null,confirm:null,menu:false,toast:'',log:[],includeBooked:false};
const root=document.getElementById('root');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRoom=x=>({lectureTheatre:'Lecture theatre',seminarRoom:'Seminar room',computerLab:'Computer lab',meetingRoom:'Meeting room'}[x]||x);
const room=id=>s.rooms.find(x=>x.id===id);
const me=()=>s.users.find(x=>x.id===s.currentId);
const isAdmin=()=>['ADMIN','SUPERADMIN'].includes(me()?.role);
const isSuper=()=>me()?.role==='SUPERADMIN';
const overlap=(b,rid,date,start,end,exclude)=>b.id!==exclude&&b.roomId===rid&&b.date===date&&b.start<end&&start<b.end;
const hasConflict=(rid,date,start,end,except)=>s.bookings.some(b=>overlap(b,rid,date,start,end,except));
const validTime=(start,end)=>/^\d\d:\d\d$/.test(start||'')&&/^\d\d:\d\d$/.test(end||'')&&start<end;
const dateLabel=(x,options={weekday:'short',day:'numeric',month:'short',year:'numeric'})=>new Date(x+'T12:00:00').toLocaleDateString('en-GB',options);
const addDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const weekOf=(date)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
const rank=(a,b)=>Number(a.id.slice(1))-Number(b.id.slice(1));
const matches=(r,q)=>r.capacity>=q.capacity&&q.features.every(f=>r.features.includes(f))&&!hasConflict(r.id,q.date,q.start,q.end);
const htmlField=(label,id,type,value,attr='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${attr}></div>`;
const btn=(text,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${text}</button>`;
function topbar(){return `<header class="topbar"><div class="brand"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span class="brand-name">CROBS</span></div><nav class="tabs" aria-label="Primary navigation">${[['find','Find rooms'],['bookings','My bookings'],...(isAdmin()?[['admin','Manage']]:[])].map(([p,t])=>`<button class="tab" data-page="${p}" ${s.page===p||s.page==='schedule'&&p==='find'?'aria-current="page"':''}>${t}</button>`).join('')}</nav><div class="account"><button class="account-toggle" data-act="account" aria-label="Account menu"><span class="avatar">${esc(me()?.id.toUpperCase()||'–')}</span><span class="who">${esc(me()?.name||'Sign in')}</span><span class="down">⌄</span></button>${s.menu?`<div class="account-menu"><div class="menu-label">Switch user · preview</div>${s.users.map(u=>`<button data-switch="${u.id}">${esc(u.name)} <small>${u.id}</small></button>`).join('')}<hr><button data-switch="">Sign out</button></div>`:''}</div></header>`;}
function findPage(){
 let q=s.search;
 let candidate=s.rooms.filter(r=>r.capacity>=q.capacity&&q.features.every(f=>r.features.includes(f))).sort(rank);
 let available=candidate.filter(r=>!hasConflict(r.id,q.date,q.start,q.end));
 let shown=s.includeBooked?candidate:available;
 let equipment=[...new Set(s.rooms.flatMap(r=>r.features))].sort();
 let equipmentControl=`<div class="field equipment"><label>Equipment · optional</label><details class="equipment-select"><summary>${q.features.length?q.features.map(f=>f==='wifi'?'Wi-Fi':f).join(', '):'Any equipment'} <span>⌄</span></summary><div class="equipment-options">${equipment.map(f=>`<label><input type="checkbox" name="equip" value="${esc(f)}" ${q.features.includes(f)?'checked':''}> ${esc(f==='wifi'?'Wi-Fi':f[0].toUpperCase()+f.slice(1))}</label>`).join('')}</div></details></div>`;
 let rows=shown.map(r=>{
   let free=!hasConflict(r.id,q.date,q.start,q.end);
   return `<article class="room-row"><div class="room-main"><div class="room-title"><strong>${fmtRoom(r.type)}</strong><code>${esc(r.id)}</code></div></div><div class="room-capacity">${r.capacity} seats</div><div class="room-description">${esc(r.features.join(' · ')||'None specified')}</div><div class="room-status ${free?'':'unavailable'}"><i class="status-dot" aria-hidden="true"></i>${free?'Available':'Booked'}</div><div class="room-actions"><button class="btn text" data-schedule="${r.id}">View week</button><button class="btn primary small" data-reserve="${r.id}" ${free?'':'disabled'}>Book room</button></div></article>`;
 }).join('');
 return `<main class="content"><div class="page-heading"><h1>Find a room</h1></div><div class="search-panel"><form id="search-form" class="filters">${htmlField('Date','f-date','date',q.date)}${htmlField('Start','f-start','time',q.start)}${htmlField('End','f-end','time',q.end)}${htmlField('People','f-capacity','number',q.capacity,'min="1"')}${equipmentControl}<button class="btn primary filter-action" type="submit">Find rooms</button></form></div><div class="results-heading"><div><h2>${available.length} ${available.length===1?'room':'rooms'} available</h2><span>${dateLabel(q.date)} · ${q.start}–${q.end}</span></div><label class="inline-toggle"><input id="include-booked" type="checkbox" ${s.includeBooked?'checked':''}>Show booked rooms</label></div><section class="results" aria-label="Room search results">${shown.length?`<div class="room-head"><span>Room</span><span>Capacity</span><span>Equipment</span><span>Status</span><span></span></div>${rows}`:`<div class="all-clear"><h3>No rooms match this time</h3><p>Try another time, reduce the capacity, or remove equipment filters.</p></div>`}</section></main>`;
}
function bookingsPage(){let mine=s.bookings.filter(b=>b.userId===s.currentId).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));return `<main class="content"><div class="page-heading"><div><h1>My bookings</h1><p class="helper">View, edit, or cancel your reservations.</p></div>${btn('Find a room','go-find','primary')}</div>${mine.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date & time</th><th>Room</th><th>Purpose</th><th>Booking ID</th><th></th></tr></thead><tbody>${mine.map(b=>`<tr><td><strong>${dateLabel(b.date,{weekday:'short',day:'numeric',month:'short'})}</strong><br><small>${b.start}–${b.end}</small></td><td><strong>${fmtRoom(room(b.roomId)?.type)}</strong><br><small>${b.roomId}</small></td><td>${esc(b.purpose||'—')}</td><td><code>${b.id}</code></td><td><div class="actions"><button data-edit-booking="${b.id}">Edit</button><button class="danger-text" data-cancel-booking="${b.id}">Cancel</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="all-clear"><h3>No bookings yet</h3><p>Available rooms are just one search away.</p>${btn('Find rooms','go-find','primary')}</div>`}</main>`;}
function schedulePage(){let r=room(s.chosenRoom);if(!r){s.page='find';return findPage();}let days=Array.from({length:7},(_,i)=>addDays(s.weekStart,i));return `<main class="content"><button class="back" data-page="find">← Back to results</button><div class="page-heading"><div><h1>${fmtRoom(r.type)} <span class="thin">${r.id}</span></h1><p class="helper">${r.capacity} seats · ${esc(r.features.join(' · '))}</p></div></div><div class="week-header"><div class="week-title"><strong>Weekly schedule</strong><small>${dateLabel(days[0])} – ${dateLabel(days[6])}</small></div><div class="row-two"><button class="btn small" data-week="-7">Previous</button><button class="btn small" data-week="7">Next</button></div></div><div class="week-days">${days.map(d=>{let events=s.bookings.filter(b=>b.roomId===r.id&&b.date===d).sort((a,b)=>a.start.localeCompare(b.start));return `<section class="day"><div class="day-head">${dateLabel(d,{weekday:'short'})}<strong>${dateLabel(d,{day:'numeric',month:'short'})}</strong></div>${events.length?events.map(b=>`<div class="event"><span>${b.start}–${b.end}</span><p>${esc(isAdmin()||b.userId===s.currentId?`${b.purpose||'Reserved'} · ${b.userId}`:'Reserved')}</p></div>`).join(''):'<div class="free-day">No bookings</div>'}<button class="btn small" data-weekbook="${d}">Book</button></section>`}).join('')}</div><p class="note">Shows reservations for seven days. Booking times are checked again when you confirm.</p></main>`;}
function adminPage(){let isRoom=s.adminPage==='rooms';return `<main class="content"><div class="page-heading"><h1>Manage</h1></div><div class="subtabs"><button class="subtab ${isRoom?'active':''}" data-admin="rooms">Rooms</button><button class="subtab ${!isRoom?'active':''}" data-admin="users">Users</button></div><div class="admin-toolbar"><h2>${isRoom?'All rooms':'Users'}</h2>${btn(isRoom?'Add room':'Add user',isRoom?'new-room':'new-user','primary')}</div>${isRoom?`<div class="table-wrap"><table class="table"><thead><tr><th>Room ID</th><th>Room type</th><th>Seats</th><th>Equipment</th><th></th></tr></thead><tbody>${s.rooms.slice().sort(rank).map(r=>`<tr><td><strong>${r.id}</strong></td><td>${fmtRoom(r.type)}</td><td>${r.capacity}</td><td>${esc(r.features.join(', ')||'—')}</td><td><div class="actions"><button data-edit-room="${r.id}">Edit</button><button class="danger-text" data-delete-room="${r.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="table-wrap"><table class="table"><thead><tr><th>User ID</th><th>Name</th><th>Role</th><th></th></tr></thead><tbody>${s.users.slice().sort(rank).map(u=>`<tr><td><strong>${u.id}</strong></td><td>${esc(u.name)}</td><td>${u.role}</td><td><div class="actions">${isSuper()&&u.id!=='u1'?`<button data-role="${u.id}">Change role</button>`:''}${u.role==='REGULAR'?`<button class="danger-text" data-delete-user="${u.id}">Remove</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}</main>`;}
function loginPage(){return `<section class="login-page"><h1>Sign in to CROBS</h1><p>Enter a user ID to continue. The project does not use passwords.</p><form id="login-form">${htmlField('User ID','login-id','text','', 'placeholder="e.g. u1" autocomplete="off"')}<button class="btn primary full" type="submit">Sign in</button></form><p class="inline-hint">Example IDs in this preview: u1, u2, u3.</p></section>`;}
function selectRoom(id){return s.rooms.map(r=>`<option value="${r.id}" ${r.id===id?'selected':''}>${fmtRoom(r.type)} (${r.id})</option>`).join('');}
function panel(){let p=s.panel;if(!p)return '';let b=p.bookingId?s.bookings.find(x=>x.id===p.bookingId):null;let r=room(p.roomId||b?.roomId);let d=p.date||b?.date||s.search.date,st=p.start||b?.start||s.search.start,en=p.end||b?.end||s.search.end;let editor=p.kind==='new-booking'||p.kind==='edit-booking';let roomEditor=p.kind==='add-room'||p.kind==='edit-room',userEditor=p.kind==='add-user',roleEditor=p.kind==='role';let title=editor?(b?'Edit booking':'Book room'):roomEditor?(p.roomId?'Edit room':'Add room'):userEditor?'Add user':'Change role';let content='';
if(editor){content=`${!b?`<div class="summary"><strong>${fmtRoom(r.type)} <span class="id">${r.id}</span></strong><p>${dateLabel(d)} · ${st}–${en}<br>${r.capacity} seats · ${esc(r.features.join(', '))}</p></div>`:''}${b?`<div class="field"><label for="edit-room">Room</label><select id="edit-room">${selectRoom(b.roomId)}</select></div>${htmlField('Date','edit-date','date',d)}<div class="row-two">${htmlField('Start','edit-start','time',st)}${htmlField('End','edit-end','time',en)}</div>`:p.fromWeek?`${htmlField('Date','edit-date','date',d)}<div class="row-two">${htmlField('Start','edit-start','time',st)}${htmlField('End','edit-end','time',en)}</div>`:''}<div class="field"><label for="purpose">Purpose · optional</label><textarea id="purpose" placeholder="e.g. Group discussion">${esc(b?.purpose||'')}</textarea></div><div id="form-error" class="error" role="alert"></div>`;}
if(roomEditor){content=`<div class="field"><label for="room-type">Room type</label><select id="room-type">${['lectureTheatre','computerLab','seminarRoom','meetingRoom'].map(t=>`<option value="${t}" ${r?.type===t?'selected':''}>${fmtRoom(t)}</option>`).join('')}</select></div>${htmlField('Capacity','room-cap','number',r?.capacity||20,'min="1"')}${htmlField('Features · comma-separated','room-features','text',r?.features.join(',')||'wifi')}<div id="form-error" class="error" role="alert"></div>`;}
if(userEditor){content=htmlField('Name','user-name','text','','placeholder="e.g. Alex Chen"')+'<p class="inline-hint">New users are created with the Regular role.</p><div id="form-error" class="error"></div>';}
if(roleEditor){let u=s.users.find(x=>x.id===p.userId);content=`<div class="summary"><strong>${esc(u.name)} <span class="id">${u.id}</span></strong><p>Current role: ${u.role}</p></div><div class="field"><label for="role-input">New role</label><select id="role-input">${['REGULAR','ADMIN'].map(t=>`<option ${u.role===t?'selected':''}>${t}</option>`).join('')}</select></div>`;}
let footer=editor?(b?'Save changes':'Confirm booking'):roomEditor?(r?'Save changes':'Add room'):userEditor?'Create user':'Update role';return `<div class="overlay" data-act="close-panel"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-header"><h2>${title}</h2><p>${editor?(b?'Update the booking details below.':'Confirm your reservation.'):roomEditor?'Manage room details.':userEditor?'Add a new regular user.':'Update access privileges.'}</p><button class="close" data-act="close-panel" aria-label="Close">×</button></div><div class="drawer-body">${content}</div><div class="drawer-footer">${btn('Cancel','close-panel')}${btn(footer,'save-panel','primary')}</div></aside>`;}
function confirmDialog(){let c=s.confirm;if(!c)return '';return `<div class="modal-wrap"><div class="modal" role="alertdialog" aria-modal="true"><h2>${esc(c.title)}</h2><p>${esc(c.message)}</p><div class="modal-actions">${btn('Keep','close-confirm')}${btn(c.action,'do-confirm','danger')}</div></div></div>`;}
function render(){root.innerHTML=topbar()+(me()?(s.page==='find'?findPage():s.page==='bookings'?bookingsPage():s.page==='admin'&&isAdmin()?adminPage():s.page==='schedule'?schedulePage():findPage()):loginPage())+panel()+confirmDialog()+(s.toast?`<div class="toast" role="status">${esc(s.toast)}</div>`:'');}
function notify(message){s.toast=message;render();setTimeout(()=>{if(s.toast===message){s.toast='';root.querySelector('.toast')?.remove();}},3100);}
function error(message){let el=document.getElementById('form-error');if(el)el.textContent=message;else notify(message);}
function goto(page){if(page==='admin'&&!isAdmin())return;s.page=page;s.menu=false;s.panel=null;render();}
function login(id){let u=s.users.find(x=>x.id===id);if(id&&!u){notify('User ID not found');return;}s.currentId=id;s.page='find';s.panel=null;s.menu=false;s.log.push(id?'login '+id:'logout');render();}
function setSearch(){let date=document.getElementById('f-date')?.value,start=document.getElementById('f-start')?.value,end=document.getElementById('f-end')?.value,capacity=Number(document.getElementById('f-capacity')?.value);let features=[...document.querySelectorAll('input[name=equip]:checked')].map(x=>x.value);if(!date||!validTime(start,end)||!Number.isInteger(capacity)||capacity<=0){notify('Check the date, time, and number of people');return;}s.search={date,start,end,capacity,features};s.log.push(`search ${date} ${start} ${end} ${capacity} ${features.join(',')}`);render();}
function reserve(id,fromWeek){let q=s.search;if(!me())return notify('Sign in to book');s.panel={kind:'new-booking',roomId:id,date:fromWeek||q.date,start:q.start,end:q.end,fromWeek:!!fromWeek};render();}
function saveBooking(){let p=s.panel,b=p.bookingId?s.bookings.find(x=>x.id===p.bookingId):null;let rid=b?document.getElementById('edit-room').value:p.roomId,date=b||p.fromWeek?document.getElementById('edit-date').value:p.date,start=b||p.fromWeek?document.getElementById('edit-start').value:p.start,end=b||p.fromWeek?document.getElementById('edit-end').value:p.end,purpose=document.getElementById('purpose').value.trim();if(!date||!validTime(start,end))return error('Start time must be before end time.');if(hasConflict(rid,date,start,end,b?.id))return error('This room is already reserved for part of the selected time.');if(b){Object.assign(b,{roomId:rid,date,start,end,purpose});s.log.push(`modifyBooking ${b.id} ${rid} ${date} ${start} ${end} ${purpose||'-'}`);}else{b={id:'b'+s.nextB++,roomId:rid,userId:s.currentId,date,start,end,purpose};s.bookings.push(b);s.log.push(`book ${rid} ${date} ${start} ${end} ${purpose||'-'}`);}s.panel=null;s.page='bookings';notify(b.id+' · '+(p.bookingId?'Booking updated':'Booking confirmed'));}
function saveRoom(){let p=s.panel,r=room(p.roomId),type=document.getElementById('room-type').value,capacity=Number(document.getElementById('room-cap').value),features=document.getElementById('room-features').value.split(',').map(x=>x.trim()).filter(Boolean);if(!Number.isInteger(capacity)||capacity<=0)return error('Capacity must be a positive integer.');if(r){r.type=type;r.capacity=capacity;r.features=features;s.log.push(`modifyRoom ${r.id} type ${type}`);s.log.push(`modifyRoom ${r.id} capacity ${capacity}`);s.log.push(`modifyRoom ${r.id} features ${features.join(',')}`);}else{let id='r'+(1+Math.max(0,...s.rooms.map(r=>Number(r.id.slice(1)))));s.rooms.push({id,type,capacity,features});s.log.push(`addRoom ${type} ${capacity} ${features.join(',')}`);}s.panel=null;notify(p.roomId?'Room updated':'Room added');}
function saveUser(){let name=document.getElementById('user-name').value.trim();if(!name)return error('Enter a user name.');let id='u'+(1+Math.max(...s.users.map(u=>Number(u.id.slice(1)))));s.users.push({id,name,role:'REGULAR'});s.log.push('addUser '+name);s.panel=null;notify('User added · '+id);}
function saveRole(){if(!isSuper())return;let u=s.users.find(x=>x.id===s.panel.userId),role=document.getElementById('role-input').value;u.role=role;s.log.push(`changeRole ${u.id} ${role}`);s.panel=null;notify('Role updated');}
function savePanel(){switch(s.panel?.kind){case'new-booking':case'edit-booking':saveBooking();break;case'add-room':case'edit-room':saveRoom();break;case'add-user':saveUser();break;case'role':saveRole();break;}}
function requestConfirm(kind,id){let b=s.bookings.find(x=>x.id===id),r=room(id),u=s.users.find(x=>x.id===id);if(kind==='booking')s.confirm={kind,id,title:'Cancel booking?',message:`${b.id} · ${fmtRoom(room(b.roomId)?.type)} · ${dateLabel(b.date)}, ${b.start}–${b.end}. This cannot be undone.`,action:'Cancel booking'};if(kind==='room')s.confirm={kind,id,title:'Delete room?',message:`${r.id} will be deleted. Its future bookings will also be canceled.`,action:'Delete room'};if(kind==='user')s.confirm={kind,id,title:'Remove user?',message:`${u.name} (${u.id}) and all their bookings will be removed.`,action:'Remove user'};render();}
function doConfirm(){let {kind,id}=s.confirm;s.confirm=null;if(kind==='booking'){let b=s.bookings.find(b=>b.id===id);if(b?.userId!==s.currentId)return notify('You cannot cancel another user’s booking');s.bookings=s.bookings.filter(b=>b.id!==id);s.log.push('deleteBooking '+id);}if(kind==='room'&&isAdmin()){s.rooms=s.rooms.filter(r=>r.id!==id);s.bookings=s.bookings.filter(b=>!(b.roomId===id&&b.date>=new Date().toISOString().slice(0,10)));s.log.push('deleteRoom '+id);}if(kind==='user'&&isAdmin()){let u=s.users.find(x=>x.id===id);if(u?.role!=='REGULAR')return notify('Only regular users can be removed');s.users=s.users.filter(u=>u.id!==id);s.bookings=s.bookings.filter(b=>b.userId!==id);s.log.push('removeUser '+id);}notify('Change saved');}
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();setSearch();}if(e.target.id==='login-form'){e.preventDefault();login(document.getElementById('login-id').value.trim().toLowerCase());}});
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-act]');if(!t)return;if(t.dataset.page){goto(t.dataset.page);return;}if(t.dataset.admin){s.adminPage=t.dataset.admin;render();return;}if(t.dataset.switch!==undefined){login(t.dataset.switch);return;}if(t.dataset.reserve){reserve(t.dataset.reserve);return;}if(t.dataset.schedule){s.chosenRoom=t.dataset.schedule;s.weekStart=weekOf(s.search.date);goto('schedule');return;}if(t.dataset.week){s.weekStart=addDays(s.weekStart,Number(t.dataset.week));render();return;}if(t.dataset.weekbook){reserve(s.chosenRoom,t.dataset.weekbook);return;}if(t.dataset.editBooking){let b=s.bookings.find(x=>x.id===t.dataset.editBooking);if(b&&b.userId===s.currentId){s.panel={kind:'edit-booking',bookingId:b.id};render();}return;}if(t.dataset.cancelBooking){requestConfirm('booking',t.dataset.cancelBooking);return;}if(t.dataset.editRoom&&isAdmin()){s.panel={kind:'edit-room',roomId:t.dataset.editRoom};render();return;}if(t.dataset.deleteRoom&&isAdmin()){requestConfirm('room',t.dataset.deleteRoom);return;}if(t.dataset.deleteUser&&isAdmin()){requestConfirm('user',t.dataset.deleteUser);return;}if(t.dataset.role&&isSuper()){s.panel={kind:'role',userId:t.dataset.role};render();return;}switch(t.dataset.act){case'account':s.menu=!s.menu;render();break;case'go-find':goto('find');break;case'close-panel':s.panel=null;render();break;case'save-panel':savePanel();break;case'new-room':if(isAdmin()){s.panel={kind:'add-room'};render();}break;case'new-user':if(isAdmin()){s.panel={kind:'add-user'};render();}break;case'close-confirm':s.confirm=null;render();break;case'do-confirm':doConfirm();break;}});
document.addEventListener('change',e=>{if(e.target.id==='include-booked'){s.includeBooked=e.target.checked;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){s.panel=null;s.confirm=null;s.menu=false;render();}});
render();
</script>
</body></html>
